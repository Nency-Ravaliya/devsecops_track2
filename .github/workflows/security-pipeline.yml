name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    - cron: '0 0 * * 0'

env:
  TERRAFORM_VERSION: 0.12.31
  CHECKOV_VERSION: 3.2.0
  TRIVY_VERSION: 0.55.2
  GITLEAKS_VERSION: v8.21.0
  SYFT_VERSION: latest
  TF_ROOT: ${{ github.workspace }}

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Terraform fmt check
        run: |
          docker run --rm -v "$PWD/reference-target/terraform/aws:/workspace" -w /workspace hashicorp/terraform:${{ env.TERRAFORM_VERSION }} fmt -check -recursive -diff || true
      - name: Terraform init and validate
        run: |
          docker run --rm -v "$PWD/reference-target/terraform/aws:/workspace" -w /workspace hashicorp/terraform:${{ env.TERRAFORM_VERSION }} init -backend=false > preflight-init.log 2>&1 || true
          docker run --rm -v "$PWD/reference-target/terraform/aws:/workspace" -w /workspace hashicorp/terraform:${{ env.TERRAFORM_VERSION }} validate > preflight-validate.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: preflight-logs
          path: |
            preflight-init.log
            preflight-validate.log

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pipeline results folder
        run: mkdir -p test/pipeline_results
      - name: Run Gitleaks secret detection
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:${{ env.GITLEAKS_VERSION }} detect --source /repo --verbose --no-git --report-format json --report-path test/pipeline_results/gitleaks-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: test/pipeline_results/gitleaks-report.json

  iac-scan:
    name: IaC scanning
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pipeline results folder
        run: mkdir -p test/pipeline_results
      - name: Checkov scan
        run: |
          docker run --rm -v "$PWD:/iac" bridgecrew/checkov:${{ env.CHECKOV_VERSION }} -d /iac --output json > test/pipeline_results/checkov-output.json || true
      - name: Trivy IaC scan
        run: |
          docker run --rm -v "$PWD:/iac" aquasec/trivy:${{ env.TRIVY_VERSION }} config --severity CRITICAL,HIGH --exit-code 1 --format sarif --output test/pipeline_results/trivy-iac-report.sarif /iac || true
      - name: tfsec scan
        run: |
          docker run --rm -v "$PWD:/iac" aquasec/tfsec:latest /iac --format sarif --out test/pipeline_results/tfsec-report.sarif || true
      - uses: actions/upload-artifact@v4
        with:
          name: iac-reports
          path: |
            test/pipeline_results/checkov-output.json
            test/pipeline_results/trivy-iac-report.sarif
            test/pipeline_results/tfsec-report.sarif

  sca-sbom:
    name: SCA and SBOM
    runs-on: ubuntu-latest
    needs: iac-scan
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pipeline results folder
        run: mkdir -p test/pipeline_results
      - name: Trivy vulnerability scan
        run: |
          docker run --rm -v "$PWD:/iac" aquasec/trivy:${{ env.TRIVY_VERSION }} fs --scanners vuln --severity CRITICAL,HIGH --exit-code 1 --format sarif --output test/pipeline_results/trivy-sca-report.sarif /iac || true
      - name: Generate SBOM with Syft
        run: |
          docker run --rm -v "$PWD:/iac" anchore/syft:${{ env.SYFT_VERSION }} dir:/iac --output cyclonedx-json=test/pipeline_results/sbom-${{ github.run_id }}.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-reports
          path: |
            test/pipeline_results/trivy-sca-report.sarif
            test/pipeline_results/sbom-*.cdx.json

  container-scan:
    name: Container scan
    runs-on: ubuntu-latest
    needs: sca-sbom
    steps:
      - uses: actions/checkout@v4
      - name: Check for Dockerfile
        id: has_dockerfile
        run: |
          if [ -f Dockerfile ] || [ -f Containerfile ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Build container image
        if: steps.has_dockerfile.outputs.exists == 'true'
        run: |
          docker build -t local-demo:latest .
      - name: Prepare pipeline results folder
        run: mkdir -p test/pipeline_results
      - name: Trivy container scan
        if: steps.has_dockerfile.outputs.exists == 'true'
        run: |
          docker run --rm aquasec/trivy:${{ env.TRIVY_VERSION }} image --severity CRITICAL,HIGH --exit-code 1 --format sarif --output test/pipeline_results/container-scan-report.sarif local-demo:latest || true
      - uses: actions/upload-artifact@v4
        with:
          name: container-reports
          path: test/pipeline_results/container-scan-report.sarif

  drift:
    name: Drift scan
    runs-on: ubuntu-latest
    needs: container-scan
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pipeline results folder
        run: mkdir -p test/pipeline_results
      - name: Drift check with Checkov
        run: |
          docker run --rm -v "$PWD:/iac" bridgecrew/checkov:${{ env.CHECKOV_VERSION }} --directory /iac --framework terraform --compact --output cli --output json --output-file-path test/pipeline_results/checkov-drift.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: test/pipeline_results/checkov-drift.json
